<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钢琴蓝色烟雾效果</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #1d2f5f 0%, #0f1629 35%, #05070e 100%);
      --white-key: #f8f8f8;
      --white-key-active: #d7e8ff;
      --black-key: #0f1115;
      --black-key-active: #2d3859;
      --border: #222;
      --glow: rgba(104, 180, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: #eef5ff;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(92vw, 980px);
      padding: 36px 24px 30px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(3px);
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #d8e8ff;
    }

    .keyboard-wrap {
      position: relative;
      width: 100%;
      height: min(34vw, 280px);
      min-height: 220px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 -12px 16px rgba(0, 0, 0, 0.3);
      background: linear-gradient(180deg, rgba(22, 34, 64, 0.55), rgba(10, 12, 20, 0.85));
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .keyboard {
      position: absolute;
      inset: auto 0 0;
      height: 90%;
      display: flex;
      z-index: 2;
      padding: 0 8px 8px;
    }

    .white-key {
      position: relative;
      flex: 1;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      background: linear-gradient(180deg, #fff, #ececec 72%, #dedede 100%);
      box-shadow: inset 0 -8px 10px rgba(0, 0, 0, 0.13);
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .white-key + .white-key {
      margin-left: 1px;
    }

    .white-key.active {
      transform: translateY(2px);
      background: linear-gradient(180deg, #eff7ff, var(--white-key-active) 70%, #bddcff 100%);
      box-shadow: 0 0 16px rgba(134, 198, 255, 0.5);
    }

    .black-key {
      position: absolute;
      width: calc((100% - 16px) / 14 * 0.62);
      height: 58%;
      top: 0;
      margin-left: calc((100% - 16px) / 14 * -0.31);
      border: 1px solid #000;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(180deg, #353a43, #0d1017 35%, #05070b 100%);
      box-shadow: inset 0 -10px 8px rgba(0, 0, 0, 0.45);
      z-index: 3;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .black-key.active {
      transform: translateY(2px);
      background: linear-gradient(180deg, #4f5772, var(--black-key-active) 48%, #11182a 100%);
      box-shadow: 0 0 14px var(--glow);
    }

    .hint {
      margin: 14px 0 0;
      text-align: center;
      font-size: 0.92rem;
      color: #b9cae9;
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1>点击钢琴键，释放蓝色烟雾</h1>
    <section class="keyboard-wrap" id="keyboardWrap" aria-label="虚拟钢琴键盘">
      <canvas id="smokeCanvas"></canvas>
      <div class="keyboard" id="keyboard"></div>
    </section>
    <p class="hint">支持鼠标点击与触屏点击</p>
  </main>

  <script>
    const keyboard = document.getElementById('keyboard');
    const keyboardWrap = document.getElementById('keyboardWrap');
    const canvas = document.getElementById('smokeCanvas');
    const ctx = canvas.getContext('2d');

    const whiteKeyCount = 14;
    const blackOffsets = [0, 1, 3, 4, 5, 7, 8, 10, 11, 12];
    const particles = [];
    let animationId;

    function setupCanvas() {
      const rect = keyboardWrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function createKeyboard() {
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < whiteKeyCount; i++) {
        const key = document.createElement('button');
        key.type = 'button';
        key.className = 'white-key';
        key.setAttribute('aria-label', `白键 ${i + 1}`);
        key.dataset.keyType = 'white';
        fragment.appendChild(key);
      }

      keyboard.appendChild(fragment);

      blackOffsets.forEach((index, i) => {
        const key = document.createElement('button');
        key.type = 'button';
        key.className = 'black-key';
        key.style.left = `calc((100% - 16px) / 14 * ${index + 1} + 8px)`;
        key.setAttribute('aria-label', `黑键 ${i + 1}`);
        key.dataset.keyType = 'black';
        keyboard.appendChild(key);
      });
    }

    function spawnSmoke(x, y, isBlack) {
      const count = isBlack ? 28 : 22;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.35 - 0.175);
        const speed = Math.random() * 1.3 + 0.3;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed * 0.75,
          vy: -Math.abs(Math.sin(angle) * speed) - (Math.random() * 1.5 + 0.4),
          radius: Math.random() * (isBlack ? 9 : 7) + 3,
          life: 1,
          fade: Math.random() * 0.015 + 0.012,
          drift: Math.random() * 0.15 - 0.075
        });
      }
    }

    function animate() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx + p.drift;
        p.y += p.vy;
        p.vy -= 0.015;
        p.vx *= 0.992;
        p.radius += 0.14;
        p.life -= p.fade;

        if (p.life <= 0 || p.y + p.radius < 0) {
          particles.splice(i, 1);
          continue;
        }

        const alpha = Math.max(p.life, 0) * 0.55;
        const gradient = ctx.createRadialGradient(p.x, p.y, p.radius * 0.2, p.x, p.y, p.radius);
        gradient.addColorStop(0, `rgba(155, 216, 255, ${alpha})`);
        gradient.addColorStop(0.45, `rgba(74, 170, 255, ${alpha * 0.85})`);
        gradient.addColorStop(1, `rgba(30, 90, 190, 0)`);
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      animationId = requestAnimationFrame(animate);
    }

    function triggerFromKey(key) {
      const rect = key.getBoundingClientRect();
      const wrapRect = keyboardWrap.getBoundingClientRect();
      const x = rect.left + rect.width / 2 - wrapRect.left;
      const y = rect.top + rect.height * 0.2 - wrapRect.top;
      const isBlack = key.dataset.keyType === 'black';

      key.classList.add('active');
      setTimeout(() => key.classList.remove('active'), 130);

      spawnSmoke(x, y, isBlack);
    }

    keyboard.addEventListener('pointerdown', (event) => {
      const key = event.target.closest('.white-key, .black-key');
      if (!key) return;
      triggerFromKey(key);
    });

    window.addEventListener('resize', setupCanvas);

    createKeyboard();
    setupCanvas();
    animate();

    window.addEventListener('beforeunload', () => cancelAnimationFrame(animationId));
  </script>
</body>
</html>
